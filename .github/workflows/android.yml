name: Android

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Android SDK installieren
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: APKs bauen und testen
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest assembleRelease
      - name: Release signieren und veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          GH_TOKEN: ${{ secrets.UPDATE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Release-Keystore fehlt}"
          : "${RELEASE_STORE_PASSWORD:?Keystore-Passwort fehlt}"
          : "${RELEASE_KEY_PASSWORD:?Schlüsselpasswort fehlt}"
          : "${RELEASE_KEY_ALIAS:?Schlüsselalias fehlt}"
          : "${GH_TOKEN:?Token für den Download-Kanal fehlt}"

          metadata=app/build/outputs/apk/release/output-metadata.json
          version=$(jq -er '.elements[0].versionName' "$metadata")
          code=$(jq -er '.elements[0].versionCode' "$metadata")
          [[ "$GITHUB_REF_NAME" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          # Betas (v1.2.3-beta.4) are published as pre-releases: only apps with the beta switch see them.
          prerelease=()
          [[ "$version" == *-beta.* ]] && prerelease=(--prerelease)
          output=$(jq -er '.elements[0].outputFile' "$metadata")

          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apk="StreamWatch-$code.apk"
          # Installs before 1.0.93 look for the earlier name; the same file is published under both.
          legacy="IPTVPlayer-$code.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$apk" "app/build/outputs/apk/release/$output"
          "$apksigner" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cp "$apk" "$legacy"
          sha256sum "$legacy" > "$legacy.sha256"
          notes() {
            awk -v heading="## $1" '
              $0 == heading { active = 1; next }
              /^## / && active { exit }
              active { print }
            ' CHANGELOG.md
          }
          # A beta uses its own section if there is one, otherwise that of the coming version.
          notes "$version" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || notes "${version%%-beta.*}" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "$legacy" "$legacy.sha256" "${prerelease[@]}" \
            --repo blatorone/IPTVPlayer-Releases --title "StreamWatch $version" --notes-file release-notes.md
