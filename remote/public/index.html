<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0d">
  <title data-i18n="page.title">StreamWatch Fernverwaltung</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand" aria-label="StreamWatch">
      <svg class="mark" viewBox="150 124 260 264" aria-hidden="true">
        <defs>
          <linearGradient id="sw-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#A855F7"/><stop offset="1" stop-color="#FF4D8D"/>
          </linearGradient>
          <mask id="sw-m"><rect x="0" y="0" width="512" height="512" fill="#fff"/>
            <rect x="150" y="226" width="260" height="16" fill="#000"/><rect x="150" y="272" width="260" height="16" fill="#000"/></mask>
        </defs>
        <path d="M196 146 L196 366 L376 256 Z" fill="url(#sw-g)" stroke="url(#sw-g)" stroke-width="44" stroke-linejoin="round" mask="url(#sw-m)"/>
      </svg>
      <span class="word">Stream<span class="watch">Watch</span></span>
    </div>
    <div class="header-right">
      <div id="status" class="status">Verbinde …</div>
      <button id="finish" class="primary" hidden data-i18n="finish.btn">Fertig – Zugriff beenden</button>
    </div>
  </header>

  <main id="intro" class="panel">
    <h1 data-i18n="intro.title">Fernverwaltung</h1>
    <p data-i18n-html="intro.text">Öffne diese Seite über den QR-Code unter <b>Einstellungen → Allgemein → Per Handy einstellen</b> in StreamWatch.</p>
  </main>

  <nav id="tabs" hidden>
    <button data-tab="portals" class="active"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H4z M8 20h8 M12 16v4"/></svg><span data-i18n="tab.portals">Portale</span></button>
    <button data-tab="countries"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17 M12 3.5c3 3.2 3 13.8 0 17 M12 3.5c-3 3.2-3 13.8 0 17"/></svg><span data-i18n="tab.countries">Länder</span></button>
    <button data-tab="categories"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v6H4z M13 5h7v6h-7z M4 13h7v6H4z M13 13h7v6h-7z"/></svg><span data-i18n="tab.categories">Kategorien</span></button>
    <button data-tab="parental"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg><span data-i18n="tab.parental">Sperren</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="tab.settings">Einstellungen</span></button>
    <button data-tab="backup"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11 M7.5 10.5L12 15l4.5-4.5 M5 19h14"/></svg><span data-i18n="tab.backup">Backup</span></button>
  </nav>

  <main id="app" hidden>
    <h1 id="page-title" class="page-title"></h1>
    <section id="tab-portals">
      <div id="portal-notice"></div>
      <div id="portal-merge"></div>
      <div id="portal-list"></div>
      <form id="portal-form" class="card" autocomplete="off">
        <h2 data-i18n="portal.addTitle">Portal hinzufügen</h2>
        <label><span data-i18n="portal.address">Portal-Adresse</span> <input name="address" type="url" inputmode="url" placeholder="http://portal.example:8080/c/" required></label>
        <label><span data-i18n="portal.mac">MAC-Adresse</span> <input name="mac" placeholder="00:1A:79:XX:XX:XX" required autocapitalize="characters"></label>
        <button type="submit" class="primary" data-i18n="portal.addBtn">Hinzufügen und laden</button>
      </form>
    </section>

    <section id="tab-countries" hidden>
      <div id="country-ask"></div>
      <p class="hint" data-i18n="country.hint">Gewählte Länder werden in dieser Reihenfolge angezeigt. Ohne Auswahl erscheinen alle Länder.</p>
      <input id="country-search" type="search" placeholder="Land suchen" data-i18n-placeholder="country.search">
      <div id="country-list"></div>
      <div class="row-actions sticky-actions">
        <button id="country-apply" class="primary" data-i18n="country.apply">Übernehmen und an Gerät senden</button>
        <button id="country-reset" data-i18n="country.reset">Verwerfen</button>
      </div>
    </section>

    <section id="tab-categories" hidden>
      <div class="segments" id="category-sections">
        <button data-section="LIVE" class="active" data-i18n="cat.live">Live-TV</button>
        <button data-section="MOVIES" data-i18n="cat.movies">Filme</button>
        <button data-section="SERIES" data-i18n="cat.series">Serien</button>
      </div>
      <input id="category-search" type="search" placeholder="Kategorie suchen" data-i18n-placeholder="cat.search">
      <div class="row-actions">
        <button id="category-show-all" data-i18n="cat.showAll">Alle gezeigten einblenden</button>
        <button id="category-hide-all" data-i18n="cat.hideAll">Alle gezeigten ausblenden</button>
      </div>
      <div id="category-list"></div>
    </section>

    <section id="tab-parental" hidden>
      <div id="parental"></div>
    </section>

    <section id="tab-settings" hidden>
      <div id="settings"></div>
    </section>

    <section id="tab-backup" hidden>
      <div id="backup"></div>
    </section>
  </main>

  <!-- PIN or password entry: a page of its own over everything (no tab bar), with a large digit pad. -->
  <div id="pin-page" hidden></div>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
