<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0d">
  <title>StreamWatch Fernverwaltung</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">▶</span> StreamWatch</div>
    <div class="header-right">
      <div id="status" class="status">Verbinde …</div>
      <button id="finish" class="primary" hidden>Fertig – Zugriff beenden</button>
    </div>
  </header>

  <main id="intro" class="panel">
    <h1>Fernverwaltung</h1>
    <p>Öffne diese Seite über den QR-Code unter <b>Einstellungen → Allgemein → Per Handy einstellen</b> in StreamWatch.</p>
  </main>

  <nav id="tabs" hidden>
    <button data-tab="portals" class="active">Portale</button>
    <button data-tab="countries">Länder</button>
    <button data-tab="categories">Kategorien</button>
    <button data-tab="parental">Kindersicherung</button>
    <button data-tab="settings">Einstellungen</button>
  </nav>

  <main id="app" hidden>
    <section id="tab-portals">
      <div id="portal-notice"></div>
      <div id="portal-merge"></div>
      <div id="portal-list"></div>
      <form id="portal-form" class="card" autocomplete="off">
        <h2>Portal hinzufügen</h2>
        <label>Portal-Adresse <input name="address" type="url" inputmode="url" placeholder="http://portal.example:8080/c/" required></label>
        <label>MAC-Adresse <input name="mac" placeholder="00:1A:79:XX:XX:XX" required autocapitalize="characters"></label>
        <button type="submit" class="primary">Hinzufügen und laden</button>
      </form>
    </section>

    <section id="tab-countries" hidden>
      <div id="country-ask"></div>
      <p class="hint">Gewählte Länder werden in dieser Reihenfolge angezeigt. Ohne Auswahl erscheinen alle Länder.</p>
      <input id="country-search" type="search" placeholder="Land suchen">
      <div id="country-list"></div>
      <div class="row-actions sticky-actions">
        <button id="country-apply" class="primary">Übernehmen und an Gerät senden</button>
        <button id="country-reset">Verwerfen</button>
      </div>
    </section>

    <section id="tab-categories" hidden>
      <div class="segments" id="category-sections">
        <button data-section="LIVE" class="active">Live-TV</button>
        <button data-section="MOVIES">Filme</button>
        <button data-section="SERIES">Serien</button>
      </div>
      <input id="category-search" type="search" placeholder="Kategorie suchen">
      <div class="row-actions">
        <button id="category-show-all">Alle gezeigten einblenden</button>
        <button id="category-hide-all">Alle gezeigten ausblenden</button>
      </div>
      <div id="category-list"></div>
    </section>

    <section id="tab-parental" hidden>
      <div id="parental"></div>
    </section>

    <section id="tab-settings" hidden>
      <div id="settings"></div>
    </section>
  </main>

  <dialog id="pin-dialog">
    <form method="dialog">
      <h2 id="pin-title">PIN</h2>
      <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" minlength="4" maxlength="12">
      <div class="row-actions">
        <button value="cancel">Abbrechen</button>
        <button value="ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
